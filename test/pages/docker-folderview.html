<script>
(function () {
  var list = document.getElementById('docker_list');
  var advanced = document.querySelector('input.advancedview');
  var labels = advanced.parentElement.querySelectorAll('.switch-button-label');
  // Unraid's Basic / Advanced switch: jquery.switchbutton.js toggles the box, the page shows
  // or hides every .advanced element.
  // jQuery's show() and toggle() take the display of a fresh element of the same tag appended
  // to <body> (getDefaultDisplay); with a grid <body> that is "block" even for rows and cells.
  function defaultDisplay(tag) {
    var temp = document.body.appendChild(document.createElement(tag));
    var display = getComputedStyle(temp).display;
    temp.remove();
    return display === 'none' ? 'block' : display;
  }
  function applyView() {
    document.querySelectorAll('#docker_containers .advanced').forEach(function (node) {
      node.style.display = advanced.checked ? defaultDisplay(node.tagName) : 'none';
    });
    labels[0].style.display = advanced.checked ? 'none' : '';
    labels[1].style.display = advanced.checked ? '' : 'none';
  }
  advanced.parentElement.querySelector('.switch-button-background').addEventListener('click', function (event) {
    event.preventDefault();
    advanced.checked = !advanced.checked;
    advanced.dispatchEvent(new Event('change'));
  });
  advanced.addEventListener('change', applyView);
  // loadlist(): $('#docker_list').html(data[0]), then the nchan load messages every few seconds.
  var load = {"a1b2c3d4e5f6":["1.5%","1.21GiB / 31.2GiB"],"b2c3d4e5f6a1":["12.75%","2.4GiB / 31.2GiB"],"c3d4e5f6a1b2":["0%","310MiB / 31.2GiB"],"e5f6a1b2c3d4":["0.25%","8.3MiB / 31.2GiB"]};
  function tick() {
    Object.keys(load).forEach(function (id) {
      var cpu = list.querySelector('.cpu-' + id);
      var mem = list.querySelector('.mem-' + id);
      if (cpu) cpu.textContent = load[id][0];
      if (mem) mem.textContent = load[id][1];
    });
  }
  setTimeout(function () {
    list.innerHTML = document.getElementById('mock-rows').innerHTML;
    if (advanced.checked) applyView();
    setTimeout(tick, 150);
  }, 250);
})();
</script>
