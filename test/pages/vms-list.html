<style>
/* dynamix.vm.manager/sheets/VMMachines.css (7.3.4, the parts the list uses) */
th.th1{width:25%}th.th2{width:15%}th.th3{width:80px}
table.domdisk thead tr th:nth-child(1){width:56%!important}table.domdisk thead tr th:nth-child(n+2){width:8%!important}
table.domdisk thead tr th:nth-child(1){padding-left:72px}table.domdisk tbody tr td:nth-child(1){padding-left:72px}
table.domdisk tbody tr:nth-child(even){background-color:transparent!important}
table tbody td{line-height:normal}i.mover{margin-right:8px;display:none}i.fa-dot-circle-o{padding-left:12px}

<script>
window.glacierFolderView = false;
window.glacierDecimalMark = '.';
window.glacierGroups = {"docker":[],"vm":[]};
window.csrf_token = 'mock-token';
window.mockCalls = [];
['ajaxVMDispatch', 'addVMContext', 'addVMSnapContext', 'selectsnapshot', 'loadlist'].forEach(function (name) {
  window[name] = function () { window.mockCalls.push([name].concat([].slice.call(arguments))); };
});
// vmmanager.js toggle_id(): shows or hides a VM's detail row (slideDownRows / slideUpRows).
window.toggle_id = function (id) {
  var row = document.getElementById(id);
  row.style.display = row.style.display === 'none' ? '' : 'none';
  return false;
};
// VMMachines.page LockButton(): the lockbutton cookie and the movers.
window.LockButton = function () {
  var on = !/(?:^|;\s*)lockbutton=/.test(document.cookie);
  document.cookie = on ? 'lockbutton=lockbutton; path=/' : 'lockbutton=; path=/; max-age=0';
  document.querySelectorAll('i.mover').forEach(function (i) { i.style.display = on ? 'inline' : 'none'; });
};
</script>
