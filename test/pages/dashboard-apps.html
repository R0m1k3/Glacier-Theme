<!-- Dashboard, Docker and VM tiles as Unraid 7.3.4 builds them (DashStats.page); the chips are
     include/DashboardApps.php's, generated with its own format strings, and arrive a moment
     after the page like DashStats' loadlist(). -->
<script>
window.glacierFolderView = false;
window.glacierDecimalMark = '.';
window.glacierGroups = {"docker":[],"vm":[]};
window.csrf_token = 'mock-token';
window.mockCalls = [];
['eventControl', 'openTerminal', 'editContainer', 'updateContainer', 'rmContainer', 'addDockerContainerContext', 'addVMContext', 'ajaxVMDispatch'].forEach(function (name) {
  window[name] = function () { window.mockCalls.push([name].concat([].slice.call(arguments))); };
});
window.loadlist = function () { window.mockCalls.push(['loadlist']); };
</script>

<script>
  // Unraid hides the tiles in CSS and shows them from its Dashboard script once laid out.
  document.querySelectorAll('div.tile').forEach(function (tile) { tile.style.display = 'block'; });
  // DashStats' loadlist(): the tiles' rows are replaced with DashboardApps.php's answer.
  window.mockReload = function () {
    ['docker_view', 'vm_view'].forEach(function (id) {
      var body = document.getElementById(id);
      var old = body.querySelector('tr.updated');
      if (old) old.remove();
      body.insertAdjacentHTML('beforeend', document.getElementById(id === 'docker_view' ? 'mock-apps' : 'mock-vms').innerHTML);
    });
    document.querySelector('.apps.switch').textContent = 'Conteneurs -- Démarrés: 4, Arrêtés: 2, En pause: 1';
    document.querySelector('.vms.switch').textContent = 'VMs -- Démarrées: 1, Arrêtées: 2, En pause: 1';
  };
  setTimeout(window.mockReload, 200);
</script>
