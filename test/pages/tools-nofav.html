<script>
  // Stands in for include/head-favourites.php and include/favourites.php.
  window.glacierFavourites = {"enabled":false,"list":[]};
  (function () {
    var real = window.fetch;
    window.fetch = function (url, options) {
      if (String(url).indexOf('/include/favourites.php') < 0) return real.apply(this, arguments);
      var body = options && options.body ? new URLSearchParams(options.body).get('favourites') : null;
      var list = body ? JSON.parse(body) : (window.glacierFavourites.list || []);
      return Promise.resolve(new Response(JSON.stringify({ favourites: list }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
    };
  })();
</script>
